<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Coding Blog | Dev Tips & Insights</title>
    <meta name="description" content="A blog about software development, coding tips, programming tutorials, and technology insights.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
      <div class="header-left-placeholder">
        <!-- Empty for now, can be used for logo or spacing -->
      </div>
      <div class="site-title-container">
        <h1><a href="index.html" class="site-title-link">GHW</a></h1>
      </div>
      <div class="header-controls">
        <div id="search-container">
          <button type="button" id="search-toggle-btn" aria-label="Open search" aria-expanded="false">
            <svg class="theme-icon" viewBox="0 0 16 16"><use xlink:href="#search"></use></svg>
          </button>
          <input type="search" id="search-input" placeholder="Search posts..." class="search-input-field search-input-hidden">
        </div>
        <button type="button" id="theme-toggle" aria-label="Toggle theme"></button>
      </div>
    </header>
    <main>
          <div class="image-banner-placeholder" data-comment="Placeholder for top page image banner (e.g., common banner sizes like 728x90, 970x250, or responsive)">
            Image Banner Placeholder (e.g., 970x250)
          </div>
        <section id="blog-posts">
            <h2 id="blog-posts-heading">커리큘럼</h2>
            <ul id="post-list">
                <!-- Blog posts will be dynamically listed here by js/script.js -->
                <li>Loading posts...</li>
            </ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 My Blog</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
