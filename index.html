<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Coding Blog | Dev Tips & Insights</title>
    <meta name="description" content="A blog about software development, coding tips, programming tutorials, and technology insights.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>My Blog</h1>
        <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
        <div id="search-container">
            <input type="search" id="search-input" placeholder="Search posts...">
        </div>
    </header>
    <main>
        <section id="blog-posts">
            <h2 id="blog-posts-heading">Blog Posts</h2>
            <ul id="post-list">
                <!-- Blog posts will be dynamically listed here by js/script.js -->
                <li>Loading posts...</li>
            </ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 My Blog</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
