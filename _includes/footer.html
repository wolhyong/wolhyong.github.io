<footer class="site-footer" role="contentinfo">
  <div class="container">
    <div class="footer-inner">
      <div class="footer-brand">
        <a href="{{ '/' | relative_url }}" class="footer-logo" aria-label="{{ site.title }} 홈">
          <span class="logo-bracket">[</span>GHW<span class="logo-bracket">]</span>
        </a>
        <p class="footer-desc">{{ site.description }}</p>
      </div>

      <div class="footer-links">
        <div class="footer-col">
          <h3>메뉴</h3>
          <ul role="list">
            <li><a href="{{ '/' | relative_url }}">홈</a></li>
            <li><a href="{{ '/blog/' | relative_url }}">글 목록</a></li>
            <li><a href="{{ '/tags/' | relative_url }}">태그</a></li>
            <li><a href="{{ '/about/' | relative_url }}">소개</a></li>
          </ul>
        </div>
        <div class="footer-col">
          <h3>링크</h3>
          <ul role="list">
            <li><a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener noreferrer">GitHub</a></li>
            <li><a href="{{ '/feed.xml' | relative_url }}">RSS 피드</a></li>
            <li><a href="{{ '/sitemap.xml' | relative_url }}">사이트맵</a></li>
          </ul>
        </div>
      </div>
    </div>

    <div class="footer-bottom">
      <p>
        <span>© {{ site.time | date: '%Y' }} {{ site.author.name }}</span>
        <span class="footer-sep" aria-hidden="true">·</span>
        <span>Built with <a href="https://jekyllrb.com" target="_blank" rel="noopener noreferrer">Jekyll</a></span>
        <span class="footer-sep" aria-hidden="true">·</span>
        <a href="{{ '/privacy/' | relative_url }}">개인정보처리방침</a>
      </p>
    </div>
  </div>
</footer>
