<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <h1>My Blog</h1>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>
    <main>
        <article id="post-content">
            <!-- Markdown content will be converted and displayed here -->
            <h2>Post Title Placeholder</h2>
            <p>This is where the content of the blog post will go. We will dynamically load and render Markdown content here.</p>
        </article>

        <section id="social-share">
            <h3>Share this post:</h3>
            <a href="#" class="share-btn twitter" target="_blank" title="Share on Twitter">Twitter</a>
            <a href="#" class="share-btn facebook" target="_blank" title="Share on Facebook">Facebook</a>
            <a href="#" class="share-btn linkedin" target="_blank" title="Share on LinkedIn">LinkedIn</a>
        </section>

        <section id="comments">
            <h2>Comments</h2>
            <div id="disqus_thread"></div>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 My Blog</p>
    </footer>
    <script src="js/script.js"></script>
    <script>
        /**
        *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
        *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */
        
        var disqus_config = function () {
            // Ensure this.page.url is the full URL to the page
            // For local development, you might need to hardcode a base URL if window.location.href is not suitable
            // e.g. this.page.url = 'https://your-domain.com/post.html?post=' + new URLSearchParams(window.location.search).get('post');
            this.page.url = window.location.href;  
            // Use the post filename as a unique identifier
            this.page.identifier = new URLSearchParams(window.location.search).get('post'); 
        };
        
        (function() { // DON'T EDIT BELOW THIS LINE
        var d = document, s = d.createElement('script');
        // IMPORTANT: Replace 'YOUR_DISQUS_SHORTNAME_HERE' with your site's actual Disqus shortname
        s.src = 'https://YOUR_DISQUS_SHORTNAME_HERE.disqus.com/embed.js'; 
        s.setAttribute('data-timestamp', +new Date());
        (d.head || d.body).appendChild(s);
        })();
    </script>
    <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
</body>
</html>
