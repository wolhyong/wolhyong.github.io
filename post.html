<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post</title> <!-- Title will be updated by JS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1><a href="index.html" style="text-decoration: none; color: inherit;">My Blog</a></h1>
    </header>

    <main>
        <div class="post-meta-container">
            <p id="post-date-display"></p> <!-- For dynamic date if needed, or just part of meta -->
            <p id="reading-time-display" class="reading-time"></p>
        </div>
        <div id="toc-container" class="toc-container">
            <!-- Table of Contents will be generated here -->
        </div>
        <article id="post-content-container">
            <!-- Full blog post content will be loaded here -->
            <p>Loading post...</p>
        </article>
    </main>

    <footer>
        <p>&copy; 2023 My Blog</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <!-- Include marked.js library -->
    <script src="js/script.js"></script>
    <!-- Social Share buttons will be dynamically added by script or can be static if preferred -->
    <!-- For now, let's add a placeholder that script can fill -->
    <div id="social-share-container" class="social-share-container" style="text-align: center; padding: 20px;">
        <!-- Share buttons will be populated here by script.js -->
        <h4>Share this post:</h4>
    </div>
</body>
</html>
