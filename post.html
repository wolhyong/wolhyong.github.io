<!DOCTYPE html>
<html lang="ko"> <!-- Changed lang to ko -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블로그 게시물</title> <!-- Changed title, will be updated by JS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/toc.css"> <!-- Added ToC CSS -->
</head>
<body>
    <header class="main-header">
        <div class="site-branding">
            <a href="index.html" class="site-title-link">
                <span class="site-name-text">GHW</span>
            </a>
        </div>
        <nav class="main-navigation">
            <ul>
                <li><a href="index.html">커리큘럼</a></li>
                <!-- Add other navigation links here if needed -->
            </ul>
        </nav>
        <div class="header-controls">
            <button type="button" id="search-toggle-btn" class="control-button" aria-label="검색 열기" aria-expanded="false" aria-controls="search-container-post">
                 <svg class="theme-icon" viewBox="0 0 16 16" fill="currentColor" style="width: 1.2em; height: 1.2em;"><use xlink:href="#search"></use></svg>
            </button>
            <div id="search-container-post" class="search-container search-input-hidden">
                <input type="text" id="search-input-post" placeholder="검색..." aria-label="Search input on post page">
            </div>
            <button type="button" id="theme-toggle" class="control-button" aria-label="테마 변경">
                <!-- Icon will be set by JS -->
            </button>
            <button type="button" id="mobile-menu-toggle" class="control-button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="mobile-menu-panel">
                <svg class="theme-icon" viewBox="0 0 16 16" fill="currentColor" style="width: 1.2em; height: 1.2em;"><use xlink:href="#list"></use></svg>
            </button>
        </div>
    </header>

    <div class="mobile-menu-panel" id="mobile-menu-panel" aria-hidden="true">
        <nav class="mobile-navigation">
            <ul>
                <li><a href="index.html">커리큘럼</a></li>
                <!-- Other links from main-navigation duplicated here -->
            </ul>
        </nav>
    </div>

    <main class="post-page-main"> <!-- Added class for specific post page main styling -->
        <div class="post-meta-container">
            <p id="post-date-display"></p>
            <p id="reading-time-display" class="reading-time"></p>
        </div>
        <div id="toc-container" class="toc-container">
            <!-- Table of Contents will be generated here -->
        </div>
        <article id="post-content-container">
            <!-- Full blog post content will be loaded here -->
            <p>Loading post...</p>
        </article>
    </main>

    <div id="social-share-container" class="social-share-container" style="text-align: center; padding: 20px;">
        <h4>Share this post:</h4>
        <!-- Share buttons will be populated here by script.js -->
    </div>

    <div id="disqus_thread" style="margin: 20px auto; max-width: 800px;"></div> <!-- Disqus container -->


    <footer class="main-footer">
        <p>&copy; 2013 Greyhacker Wolhyong Development Blog. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/script.js"></script>
    <script id="dsq-count-scr" src="//YOUR_DISQUS_SHORTNAME_HERE.disqus.com/count.js" async></script> <!-- Disqus count script, replace shortname -->
    <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
</body>
</html>
